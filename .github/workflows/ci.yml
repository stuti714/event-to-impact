name: Build and test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ml_service/requirements.txt
      - name: Test recommendation model
        run: |
          python -m pip install -r ml_service/requirements.txt
          python data/validate_dataset.py
          python -m pytest ml_service/test_recommender.py -q
      - name: Test Spring application
        run: ./mvnw clean test
